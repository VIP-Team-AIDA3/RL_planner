course_path: ros2_ws/src/pylon_2026_world/purt_course2.yaml

# Minimum radius of every arc in the path. Sport Cub S2 in SAFE Experienced mode (no bank limit):
# ~7 m/s at a 45 deg bank -> R = V^2 / (g tan 45) = 5.0 m. Replace with a measured value when available.
turn_radius_m: 5.0
n_crossing_points: 5              # positions across each gate
heading_offsets_deg: [-60, -30, 0, 30, 60]   # from the gate normal, used in both directions
sample_ds_m: 0.1                  # spacing of the pylon / bounds checks along each leg

# leg cost in meters = length + pylon_penalty * int max(0, R_field - d) ds + oob_penalty * exits
pylon_penalty_m_per_m2: 7.0
oob_penalty_m: 35.0

noise: 0.2                        # chance a crossing slips to a neighboring pose
gamma: 1.0
alpha: 0.1
epsilon: 0.1
episodes: 60000                  # 60k reaches the DP lap without noise (seeds 0-4)
seed: 0

output_dir: dubins_preplanner/out
