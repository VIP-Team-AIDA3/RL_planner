course_path: ros2_ws/src/pylon_2026_world/purt_course2.yaml

turn_radius_m: 10.71           # minimum radius of every arc in the path

discretization:
  n_crossing_points: 5
  heading_offsets_deg: [-60, -30, 0, 30, 60]
  both_directions: true
  sample_ds_m: 0.1

costs:                         # leg cost in meters = length + pylon penalty + OOB penalty
  pylon_field_radius_m: null   # null -> course gate_margin_m
  pylon_penalty_m_per_m2: 7.0  # weight on int max(0, R_field - d) ds
  oob_mode: penalty            # penalty | forbid
  oob_penalty_m: 35.0          # added per exit from the bounds rectangle

lap:
  mode: single                 # single | periodic (periodic is DP only)
  start_pose_index: null       # null -> DP picks the best G1 start pose

rl:
  p_slip: 0.2
  episodes: 20000
  alpha: 0.1
  gamma: 1.0
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 15000
  seed: 0

output_dir: dubins_preplanner/out
